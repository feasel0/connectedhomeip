name: PR72821 Apple Qualification

on:
  push:
    branches: [experiment/pr72821-minimal]
    paths: [.github/workflows/pr72821-apple-qualification.yaml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native:
    if: github.repository == 'feasel0/connectedhomeip'
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [guard-disabled, rejection-cancel-disabled, unconditional-cancel-disabled, direct-error-gating, corrected]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3955d65f52463457f5feba3be4e6d9f354544a6d
      - name: Verify exact Darwin overlap regression source
        run: |
          test "$(git rev-parse HEAD)" = 3955d65f52463457f5feba3be4e6d9f354544a6d
      - name: Restore the selected rejection defect for the negative control
        if: matrix.variant != 'corrected'
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("src/platform/Darwin/BleConnectionDelegateImpl.mm")
          source = path.read_text()
          guard = "VerifyOrReturnError(![ble hasPendingConnectionCallbacks], CHIP_ERROR_BUSY);"
          object_guard = "if ([ble hasPendingConnectionCallbacks]) {\n                QueueConnectionError(appState, OnConnectionError, CHIP_ERROR_BUSY, appState == bleLayer);\n                return;\n            }"
          cancel_guard = "if (mConnectionErrorPending) {\n                ++mCancellationGeneration;\n                mConnectionErrorPending = false;\n                return CHIP_NO_ERROR;\n            }"
          cancel_start = 'CHIP_ERROR BleConnectionDelegateImpl::CancelConnection()\n        {\n            assertChipStackLockedByCurrentThread();\n            ChipLogProgress(Ble, "ConnectionDelegate CancelConnection");\n            ++mCancellationGeneration;'
          generation_guard = "if (!ownsCancellation || mCancellationGeneration == cancellationGeneration)"
          if os.environ["VARIANT"] == "guard-disabled":
              assert source.count(guard) == 1
              assert source.count(object_guard) == 1
              source = source.replace(guard, "").replace(object_guard, "")
          elif os.environ["VARIANT"] == "rejection-cancel-disabled":
              assert source.count(cancel_guard) == 1
              source = source.replace(cancel_guard, "")
          elif os.environ["VARIANT"] == "unconditional-cancel-disabled":
              assert source.count(cancel_start) == 1
              unconditional_guard = cancel_guard.replace("                ++mCancellationGeneration;\n", "")
              source = source.replace(cancel_start, cancel_start + "\n            " + unconditional_guard)
          else:
              assert os.environ["VARIANT"] == "direct-error-gating"
              assert source.count(generation_guard) == 1
              source = source.replace(generation_guard, "if (mCancellationGeneration == cancellationGeneration)")
          path.write_text(source)
          print("Only the selected guards are disabled; tests and other fixes are unchanged.")
          PY
      - name: Record exact source and Apple toolchain
        run: |
          git rev-parse HEAD
          sw_vers
          xcodebuild -version
      - uses: ./.github/actions/checkout-submodules-and-bootstrap
        with:
          platform: darwin
          bootstrap-log-name: bootstrap-logs-pr72821-native
      - name: Compile native BLE regression executable
        run: |
          scripts/run_in_build_env.sh 'gn gen out/pr72821-native --args="chip_build_tests=true chip_enable_ble=true chip_config_network_layer_ble=true chip_support_thread_meshcop=false symbol_level=0" && ninja -C out/pr72821-native -j4 src/platform/tests:TestDarwinBleConnection.mm'
      - name: Execute native browsing, cancellation and overlap regressions
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          result = subprocess.run(
              ["out/pr72821-native/tests/TestDarwinBleConnection.mm"],
              capture_output=True, text=True, timeout=180,
          )
          lines = (result.stdout + result.stderr).splitlines()
          for line in lines:
              if result.returncode != 0 or any(marker in line for marker in (
                  "[ RUN      ]", "[       OK ]", "[  FAILED  ]",
                  "[==========]", "[  PASSED  ]", "Failure",
                  "AddressSanitizer", "runtime error:",
              )):
                  print(line)
          for name in (
              "NormalBrowsingRetiresPendingRequest",
              "BrowsingReplacementAllowsReentrantRetry",
              "PrewarmPreservesPendingRequest",
              "CanceledObjectErrorDoesNotRetireReplacement",
              "ObjectErrorsRemainAsynchronousAndReusable",
              "CanceledObjectErrorDoesNotConsumeFreshObjectError",
              "NormalCancellationAllowsFreshRequest",
          ):
              assert any("[       OK ]" in line and name in line for line in lines), name
          if os.environ["VARIANT"] != "corrected":
              assert result.returncode == 1, result.returncode
              expected = {
                  "guard-disabled": (
                  "SinglePendingRejectsPluralCommonAndBackend",
                  "PluralPendingRejectsPluralCommonAndBackend",
                  "PluralPendingRejectsSingleAndObjectAsynchronously",
                  ),
                  "rejection-cancel-disabled": ("CanceledBusyErrorsDoNotRetireReplacement",),
                  "unconditional-cancel-disabled": ("UnconditionalCancellationStopsPluralWithQueuedRejection",),
                  "direct-error-gating": ("OwnerCancellationPreservesUnrelatedQueuedError",),
              }
              for name in expected[os.environ["VARIANT"]]:
                  assert any("[  FAILED  ]" in line and name in line for line in lines), name
              print("Verified the selected negative control fails its behavioral regressions.")
          else:
              assert result.returncode == 0, result.returncode
              for name in (
                  "SinglePendingRejectsPluralCommonAndBackend",
                  "PluralPendingRejectsPluralCommonAndBackend",
                  "PluralPendingRejectsSingleAndObjectAsynchronously",
                  "SinglePendingRejectsDirectSingleAndObjectAsynchronously",
                  "EachPendingCallbackSlotRejectsOverlap",
                  "CompletedPluralAllowsFreshSingleAndPlural",
                  "PluralCompletionAllowsReentrantSingle",
                  "QueuedBusyErrorPreservesReentrantPluralReplacement",
                  "PluralErrorAllowsReentrantPlural",
                  "DirectBusyErrorsDoNotPreventAcceptedOwnerCancellation",
                  "UnconditionalCancellationStopsPluralWithQueuedRejection",
                  "OwnerCancellationPreservesUnrelatedQueuedError",
                  "CanceledBusyErrorsDoNotRetireReplacement",
                  "CanceledBusyErrorDoesNotConsumeFreshBusyError",
                  "CanceledBusyErrorDoesNotConsumeFreshBusyCancellation",
                  "DeliveredBusyErrorAllowsReentrantActiveCancellation",
                  "PluralBrowsingRetiresPendingRequest",
                  "PluralPrewarmPreservesPendingRequest",
              ):
                  assert any("[       OK ]" in line and name in line for line in lines), name
              print("Verified all 25 native Darwin BLE regressions passed.")
          PY
  xcresult:
    if: github.repository == 'feasel0/connectedhomeip' && github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Decode original upstream TSan result bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/project-chip/connectedhomeip/actions/artifacts/12310192358/zip > tsan.zip
          unzip -q tsan.zip -d original
          result=$(find original -type d -name TestResults.xcresult -print -quit)
          test -n "$result"
          xcrun xcresulttool get test-results summary --path "$result" > summary.json
          python3 - <<'PY'
          import json

          with open("summary.json") as source:
              result = json.load(source)
          for key in ("title", "result", "passedTests", "failedTests", "skippedTests", "testFailures"):
              if key in result:
                  print(f"{key}: {json.dumps(result[key])}")
          assert "testRunItem" in json.dumps(result)
          PY
