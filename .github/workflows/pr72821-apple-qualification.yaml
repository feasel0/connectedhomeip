name: PR72821 Apple Qualification

on:
  push:
    branches: [experiment/pr72821-minimal]
    paths: [.github/workflows/pr72821-apple-qualification.yaml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native:
    if: github.repository == 'feasel0/connectedhomeip'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 91f7c73d3e78bdb3b6dd6ce3da9bfa811c7ee477
      - name: Verify exact Darwin cancellation regression source
        run: |
          test "$(git rev-parse HEAD)" = 91f7c73d3e78bdb3b6dd6ce3da9bfa811c7ee477
      - name: Record exact source and Apple toolchain
        run: |
          git rev-parse HEAD
          sw_vers
          xcodebuild -version
      - uses: ./.github/actions/checkout-submodules-and-bootstrap
        with:
          platform: darwin
          bootstrap-log-name: bootstrap-logs-pr72821-native
      - name: Compile native BLE regression executable
        run: |
          scripts/run_in_build_env.sh 'gn gen out/pr72821-native --args="chip_build_tests=true chip_enable_ble=true chip_config_network_layer_ble=true chip_support_thread_meshcop=false symbol_level=0" && ninja -C out/pr72821-native -j4 src/platform/tests:TestDarwinBleConnection.mm'
      - name: Execute native browsing and cancellation regressions
        run: |
          python3 - <<'PY'
          import subprocess

          result = subprocess.run(
              ["out/pr72821-native/tests/TestDarwinBleConnection.mm"],
              capture_output=True, text=True, timeout=180,
          )
          lines = (result.stdout + result.stderr).splitlines()
          for line in lines:
              if any(marker in line for marker in (
                  "[ RUN      ]", "[       OK ]", "[  FAILED  ]",
                  "[==========]", "[  PASSED  ]", "Failure",
                  "AddressSanitizer", "runtime error:",
              )):
                  print(line)
          for name in (
              "NormalBrowsingRetiresPendingRequest",
              "BrowsingReplacementAllowsReentrantRetry",
              "PrewarmPreservesPendingRequest",
              "CanceledObjectErrorDoesNotRetireReplacement",
          ):
              assert any("[       OK ]" in line and name in line for line in lines), name
          assert result.returncode == 0, result.returncode
          print("Verified all native Darwin BLE regressions passed.")
          PY
  xcresult:
    if: github.repository == 'feasel0/connectedhomeip' && github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Decode original upstream TSan result bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/project-chip/connectedhomeip/actions/artifacts/12310192358/zip > tsan.zip
          unzip -q tsan.zip -d original
          result=$(find original -type d -name TestResults.xcresult -print -quit)
          test -n "$result"
          xcrun xcresulttool get test-results summary --path "$result" > summary.json
          python3 - <<'PY'
          import json

          with open("summary.json") as source:
              result = json.load(source)
          for key in ("title", "result", "passedTests", "failedTests", "skippedTests", "testFailures"):
              if key in result:
                  print(f"{key}: {json.dumps(result[key])}")
          assert "testRunItem" in json.dumps(result)
          PY
